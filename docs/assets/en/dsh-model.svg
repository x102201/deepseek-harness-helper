<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" fill="none">
  <rect width="720" height="240" rx="12" fill="#f8fafc"/>
  <rect x="1" y="1" width="718" height="238" rx="11" stroke="#e2e8f0"/>
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Default: only 1 dsh (1 DSH_HOME)</text>
  <rect x="180" y="52" width="360" height="120" rx="10" fill="#fff" stroke="#f87171" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">One dsh · one workspace</text>
  <rect x="200" y="92" width="64" height="24" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="232" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#b91c1c">Support</text>
  <rect x="272" y="92" width="64" height="24" rx="4" fill="#fff7ed" stroke="#fdba74"/>
  <text x="304" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#c2410c">Tests</text>
  <rect x="344" y="92" width="64" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="376" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#1d4ed8">Code</text>
  <rect x="416" y="92" width="48" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="440" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">…</text>
  <text x="360" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">All plugins pile here · one preset active per session</text>
  <text x="360" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#991b1b">Two workloads in parallel? One dsh cannot carry them.</text>
