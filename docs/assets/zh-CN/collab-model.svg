<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 308" fill="none">
  <rect width="720" height="308" rx="12" fill="#f8fafc"/>
  <rect x="1" y="1" width="718" height="306" rx="11" stroke="#e2e8f0"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0f172a">专职实例：同一工作区并行，而不是一台机器一个实例</text>

  <rect x="16" y="44" width="328" height="244" rx="10" fill="#fff" stroke="#fca5a5"/>
  <text x="180" y="68" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#991b1b">三台电脑 · 各一套 dsh</text>

  <rect x="40" y="84" width="280" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="52" y="94" width="44" height="28" rx="3" fill="#fff" stroke="#f87171"/>
  <rect x="68" y="122" width="12" height="3" rx="1" fill="#f87171"/>
  <text x="110" y="108" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">电脑 1 · 客服实例</text>
  <text x="110" y="124" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">独立目录 · 无法同工作区查看</text>

  <rect x="40" y="140" width="280" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="52" y="150" width="44" height="28" rx="3" fill="#fff" stroke="#f87171"/>
  <rect x="68" y="178" width="12" height="3" rx="1" fill="#f87171"/>
  <text x="110" y="164" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">电脑 2 · 开发实例</text>
  <text x="110" y="180" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">文件仍需在机器间复制</text>

  <rect x="40" y="196" width="280" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="52" y="206" width="44" height="28" rx="3" fill="#fff" stroke="#f87171"/>
  <rect x="68" y="234" width="12" height="3" rx="1" fill="#f87171"/>
  <text x="110" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">电脑 3 · 测试实例</text>
  <text x="110" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">硬件占用三倍，协作仍然断开</text>

  <text x="180" y="272" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#991b1b">增加成本 · 也无法在同一工作区推进</text>

  <text x="360" y="172" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#94a3b8">→</text>

  <rect x="376" y="44" width="328" height="244" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="540" y="68" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">一台电脑 · 三个专职实例</text>

  <rect x="400" y="84" width="280" height="148" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="104" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">同一工作区 · 分屏调度</text>
  <rect x="412" y="114" width="80" height="52" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="452" y="144" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1e40af">客服</text>
  <rect x="500" y="114" width="80" height="52" rx="4" fill="#ffedd5" stroke="#f97316"/>
  <text x="540" y="144" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#c2410c">开发</text>
  <rect x="588" y="114" width="80" height="52" rx="4" fill="#d1fae5" stroke="#10b981"/>
  <text x="628" y="144" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#047857">测试</text>
  <rect x="412" y="176" width="256" height="40" rx="4" fill="#fff" stroke="#93c5fd"/>
  <text x="540" y="200" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">共用同一个项目目录</text>

  <text x="540" y="256" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">插件按实例隔离 · 文件在同一工作区</text>
  <text x="540" y="274" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">三个专职实例 · 推进同一版本</text>
</svg>