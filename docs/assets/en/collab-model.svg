<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 308" fill="none">
  <rect width="720" height="308" rx="12" fill="#f8fafc"/>
  <rect x="1" y="1" width="718" height="306" rx="11" stroke="#e2e8f0"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Dedicated instances: one workspace, not one instance per PC</text>

  <rect x="16" y="44" width="328" height="244" rx="10" fill="#fff" stroke="#fca5a5"/>
  <text x="180" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Three computers, one dsh each</text>

  <rect x="40" y="84" width="280" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="52" y="94" width="44" height="28" rx="3" fill="#fff" stroke="#f87171"/>
  <rect x="68" y="122" width="12" height="3" rx="1" fill="#f87171"/>
  <text x="110" y="108" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">PC 1 - Support instance</text>
  <text x="110" y="124" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Own folder - not in one workspace</text>

  <rect x="40" y="140" width="280" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="52" y="150" width="44" height="28" rx="3" fill="#fff" stroke="#f87171"/>
  <rect x="68" y="178" width="12" height="3" rx="1" fill="#f87171"/>
  <text x="110" y="164" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">PC 2 - Coding instance</text>
  <text x="110" y="180" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Files still copied between machines</text>

  <rect x="40" y="196" width="280" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="52" y="206" width="44" height="28" rx="3" fill="#fff" stroke="#f87171"/>
  <rect x="68" y="234" width="12" height="3" rx="1" fill="#f87171"/>
  <text x="110" y="220" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">PC 3 - Testing instance</text>
  <text x="110" y="236" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">3x hardware; collaboration still split</text>

  <text x="180" y="272" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#991b1b">Higher cost - cannot advance in one workspace</text>

  <text x="360" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#94a3b8">-&gt;</text>

  <rect x="376" y="44" width="328" height="244" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="540" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">One computer, three dedicated instances</text>

  <rect x="400" y="84" width="280" height="148" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">One workspace - dispatch from split panes</text>
  <rect x="412" y="114" width="80" height="52" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="452" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e40af">Support</text>
  <rect x="500" y="114" width="80" height="52" rx="4" fill="#ffedd5" stroke="#f97316"/>
  <text x="540" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#c2410c">Code</text>
  <rect x="588" y="114" width="80" height="52" rx="4" fill="#d1fae5" stroke="#10b981"/>
  <text x="628" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#047857">Tests</text>
  <rect x="412" y="176" width="256" height="40" rx="4" fill="#fff" stroke="#93c5fd"/>
  <text x="540" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Same project folder</text>

  <text x="540" y="256" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Plugins isolated per instance - files in one workspace</text>
  <text x="540" y="274" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Three dedicated instances, one version</text>
</svg>